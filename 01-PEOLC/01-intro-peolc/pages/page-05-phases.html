<section id="page-5" class="page" aria-label="Phases and Layers of End of Life Care">
  <div class="phases-wrap">
    <h2 class="phases-page-title">Phases &amp; Layers of Care</h2>
    <p class="phases-page-sub">
      Select each phase and each layer to explore what they involve.
      Try to open at least <strong>4 phases</strong> before moving on.
    </p>

    <!-- Timeline -->
    <div class="phases-timeline-wrap">
      <div class="phases-timeline-label">End of Life Care Phases — Wong et al. (2024)</div>
      <div class="phases-track" role="list" aria-label="Five phases of end of life care">

        <button class="phase-node" id="phase-btn-1" role="listitem"
                onclick="openPhaseDetail('phase',1)"
                aria-label="Phase 1: Stable — click to learn more">
          <span class="phase-node-dot phase-node-dot-1" aria-hidden="true">1</span>
          <span class="phase-node-title">Stable</span>
          <span class="phase-node-hint">Condition managed — planning begins</span>
        </button>

        <button class="phase-node" id="phase-btn-2" role="listitem"
                onclick="openPhaseDetail('phase',2)"
                aria-label="Phase 2: Unstable — click to learn more">
          <span class="phase-node-dot phase-node-dot-2" aria-hidden="true">2</span>
          <span class="phase-node-title">Unstable</span>
          <span class="phase-node-hint">Unpredictable changes in condition</span>
        </button>

        <button class="phase-node" id="phase-btn-3" role="listitem"
                onclick="openPhaseDetail('phase',3)"
                aria-label="Phase 3: Deteriorating — click to learn more">
          <span class="phase-node-dot phase-node-dot-3" aria-hidden="true">3</span>
          <span class="phase-node-title">Deteriorating</span>
          <span class="phase-node-hint">Gradual, expected decline</span>
        </button>

        <button class="phase-node" id="phase-btn-4" role="listitem"
                onclick="openPhaseDetail('phase',4)"
                aria-label="Phase 4: Terminal — click to learn more">
          <span class="phase-node-dot phase-node-dot-4" aria-hidden="true">4</span>
          <span class="phase-node-title">Terminal</span>
          <span class="phase-node-hint">Final hours to days of life</span>
        </button>

        <button class="phase-node" id="phase-btn-5" role="listitem"
                onclick="openPhaseDetail('phase',5)"
                aria-label="Phase 5: Bereavement — click to learn more">
          <span class="phase-node-dot phase-node-dot-5" aria-hidden="true">5</span>
          <span class="phase-node-title">Bereavement</span>
          <span class="phase-node-hint">Support for families after death</span>
        </button>

      </div>
    </div>

    <!-- Layers -->
    <div class="layers-section">
      <div class="layers-section-label">The Six Layers of Palliative Support</div>

      <div class="layers-diagram-row">
        <!-- Concentric rings — Physical Care at the core, Coordination & MDT as the
             outermost, overarching layer. Each ring/badge is independently clickable
             and keyboard-operable (role="button", tabindex, aria-label) and opens the
             same detail modal as the legend list below. -->
        <svg class="layers-rings" viewBox="0 0 380 380" role="img" aria-label="Six concentric layers of palliative support, from Physical Care at the core to Coordination and MDT at the outermost layer">
          <g id="layer-btn-6" data-layer="6" class="layer-ring" tabindex="0" role="button"
             aria-label="Layer 6: Coordination and MDT — click to learn more"
             onclick="openPhaseDetail('layer',6)"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openPhaseDetail('layer',6);}">
            <circle cx="190" cy="190" r="165" fill="none" stroke="#0d9488" stroke-width="20" opacity="0.88"/>
            <circle class="layer-badge" cx="190" cy="25" r="15" fill="#0c1a3a"/>
            <text x="190" y="31" text-anchor="middle" font-size="16">🔗</text>
          </g>

          <g id="layer-btn-5" data-layer="5" class="layer-ring" tabindex="0" role="button"
             aria-label="Layer 5: Communication and ACP — click to learn more"
             onclick="openPhaseDetail('layer',5)"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openPhaseDetail('layer',5);}">
            <circle cx="190" cy="190" r="140" fill="none" stroke="#0197de" stroke-width="20" opacity="0.88"/>
            <circle class="layer-badge" cx="190" cy="50" r="15" fill="#0c1a3a"/>
            <text x="190" y="56" text-anchor="middle" font-size="16">💬</text>
          </g>

          <g id="layer-btn-4" data-layer="4" class="layer-ring" tabindex="0" role="button"
             aria-label="Layer 4: Spiritual and Cultural — click to learn more"
             onclick="openPhaseDetail('layer',4)"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openPhaseDetail('layer',4);}">
            <circle cx="190" cy="190" r="115" fill="none" stroke="#d97706" stroke-width="20" opacity="0.88"/>
            <circle class="layer-badge" cx="190" cy="75" r="15" fill="#0c1a3a"/>
            <text x="190" y="81" text-anchor="middle" font-size="16">✨</text>
          </g>

          <g id="layer-btn-3" data-layer="3" class="layer-ring" tabindex="0" role="button"
             aria-label="Layer 3: Social and Practical — click to learn more"
             onclick="openPhaseDetail('layer',3)"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openPhaseDetail('layer',3);}">
            <circle cx="190" cy="190" r="90" fill="none" stroke="#059669" stroke-width="20" opacity="0.9"/>
            <circle class="layer-badge" cx="190" cy="100" r="15" fill="#0c1a3a"/>
            <text x="190" y="106" text-anchor="middle" font-size="16">🤝</text>
          </g>

          <g id="layer-btn-2" data-layer="2" class="layer-ring" tabindex="0" role="button"
             aria-label="Layer 2: Psychological and Emotional — click to learn more"
             onclick="openPhaseDetail('layer',2)"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openPhaseDetail('layer',2);}">
            <circle cx="190" cy="190" r="65" fill="none" stroke="#7c6ef5" stroke-width="20" opacity="0.9"/>
            <circle class="layer-badge" cx="190" cy="125" r="15" fill="#0c1a3a"/>
            <text x="190" y="131" text-anchor="middle" font-size="16">🕊️</text>
          </g>

          <g id="layer-btn-1" data-layer="1" class="layer-ring layer-ring-core" tabindex="0" role="button"
             aria-label="Layer 1: Physical Care — the core of palliative support — click to learn more"
             onclick="openPhaseDetail('layer',1)"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openPhaseDetail('layer',1);}">
            <circle cx="190" cy="190" r="40" fill="#0197de"/>
            <text x="190" y="196" text-anchor="middle" font-size="22">🩺</text>
          </g>
        </svg>

        <div class="layers-grid" role="list" aria-label="Six layers of palliative care support, listed">

          <button class="layer-btn" id="layer-legend-1" data-layer="1" role="listitem"
                  onclick="openPhaseDetail('layer',1)"
                  aria-label="Layer 1: Physical Care — click to learn more">
            <div class="layer-swatch" style="background:#0197de;" aria-hidden="true"></div>
            <div>
              <div class="layer-title">Physical Care</div>
              <div class="layer-sub">Symptom control &amp; comfort</div>
            </div>
          </button>

          <button class="layer-btn" id="layer-legend-2" data-layer="2" role="listitem"
                  onclick="openPhaseDetail('layer',2)"
                  aria-label="Layer 2: Psychological &amp; Emotional — click to learn more">
            <div class="layer-swatch" style="background:#7c6ef5;" aria-hidden="true"></div>
            <div>
              <div class="layer-title">Psychological &amp; Emotional</div>
              <div class="layer-sub">Mental wellbeing &amp; support</div>
            </div>
          </button>

          <button class="layer-btn" id="layer-legend-3" data-layer="3" role="listitem"
                  onclick="openPhaseDetail('layer',3)"
                  aria-label="Layer 3: Social &amp; Practical — click to learn more">
            <div class="layer-swatch" style="background:#059669;" aria-hidden="true"></div>
            <div>
              <div class="layer-title">Social &amp; Practical</div>
              <div class="layer-sub">Day-to-day needs &amp; networks</div>
            </div>
          </button>

          <button class="layer-btn" id="layer-legend-4" data-layer="4" role="listitem"
                  onclick="openPhaseDetail('layer',4)"
                  aria-label="Layer 4: Spiritual &amp; Cultural — click to learn more">
            <div class="layer-swatch" style="background:#d97706;" aria-hidden="true"></div>
            <div>
              <div class="layer-title">Spiritual &amp; Cultural</div>
              <div class="layer-sub">Beliefs, values &amp; identity</div>
            </div>
          </button>

          <button class="layer-btn" id="layer-legend-5" data-layer="5" role="listitem"
                  onclick="openPhaseDetail('layer',5)"
                  aria-label="Layer 5: Communication &amp; ACP — click to learn more">
            <div class="layer-swatch" style="background:#0197de;" aria-hidden="true"></div>
            <div>
              <div class="layer-title">Communication &amp; ACP</div>
              <div class="layer-sub">Conversations &amp; advance planning</div>
            </div>
          </button>

          <button class="layer-btn" id="layer-legend-6" data-layer="6" role="listitem"
                  onclick="openPhaseDetail('layer',6)"
                  aria-label="Layer 6: Coordination &amp; MDT — click to learn more">
            <div class="layer-swatch" style="background:#0d9488;" aria-hidden="true"></div>
            <div>
              <div class="layer-title">Coordination &amp; MDT</div>
              <div class="layer-sub">Joined-up, team-based care</div>
            </div>
          </button>

        </div>
      </div>
    </div>

    <div class="phases-hint" aria-live="polite" id="phases-hint">
      Tap any phase or layer to explore it
    </div>

    <div class="hs-continue-wrap">
      <button class="btn btn-secondary" style="border-color:rgba(255,255,255,.25);color:#fff;" onclick="goToPage(4)">← Back</button>
      <button class="btn btn-primary" onclick="goToPage(6)">Continue →</button>
    </div>
  </div>
</section>
